apiVersion: 1

# 本插件用 jsonData.host + port，不用 url。同机另一网络用 host.docker.internal；不同机器改 host 为 IP。
datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    access: proxy
    jsonData:
      protocol: http
      host: host.docker.internal
      port: 8123
      defaultDatabase: chart
      username: root
    secureJsonData:
      password: passwd123
    editable: true
    isDefault: false
