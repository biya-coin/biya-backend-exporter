global:
  scrape_interval: 15s
  evaluation_interval: 30s

# 告警规则配置
rule_files:
  - /etc/prometheus/alert_rules.yml

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # 如果使用 Docker Compose，使用服务名
            - 'alertmanager:9093'
            # 如果本地运行，使用 localhost
            # - 'localhost:9093'
      timeout: 10s

# 说明：
# - 当前配置包含告警规则和 Alertmanager 连接配置
# - 本地 Exporter 端口由你提供为 18080
# - Alertmanager 默认端口为 9093
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: biya-exporter
    metrics_path: /metrics
    static_configs:
      # Prometheus 在 compose 容器内运行时，使用服务名访问 exporter
      - targets: ["exporter:18080"]


  - job_name: validator-node-exporter
    metrics_path: /metrics
    static_configs:
      # 收集所有验证者节点的 node_exporter 指标
      - targets:
          - "10.8.21.50:9100"
          - "10.8.45.209:9100"
          - "10.8.61.62:9100"
          - "10.8.161.142:9100"
          - "10.8.155.185:9100"
          - "10.8.160.37:9100"

  - job_name: validator-node-metrics
    metrics_path: /metrics
    static_configs:
      # 收集所有验证者节点的 26760/metrics 指标
      - targets:
          - "10.8.191.36:26760"
          - "10.8.45.209:26760"
          - "10.8.61.62:26760"
          - "10.8.161.142:26760"
