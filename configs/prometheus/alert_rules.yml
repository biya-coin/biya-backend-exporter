groups:
  # ==========================================
  # 1. 区块链核心告警
  # ==========================================
  - name: blockchain_core_alerts
    interval: 30s
    rules:
      # 停止出块告警
      - alert: 停止出块
        expr: |
          (
            # 检查区块高度是否在5分钟内没有变化
            (changes(biya_chain_head_block_height[5m]) == 0)
            and
            (biya_chain_head_block_height > 0)
          )
          or
          (
            # 备用方案：使用biya_block_height
            (changes(biya_block_height[5m]) == 0)
            and
            (biya_block_height > 0)
          )
        for: 5m
        labels:
          severity: critical
          category: availability
          subsystem: consensus
        annotations:
          summary: "区块链停止出块"
          description: "最新区块超过5分钟未更新，链可能已停止运行"
          处理建议: |
            1. 立即检查所有验证者节点状态
            2. 查看网络连接是否正常
            3. 检查是否有共识问题
            4. 启动紧急恢复流程

      # 出块延迟告警
      - alert: 出块延迟
        expr: |
          (
            biya_block_interval
            > 
            (biya_avg_block_time * 3)
          )
          and
          (biya_avg_block_time > 0)
        for: 1m
        labels:
          severity: warning
          category: performance
          subsystem: consensus
        annotations:
          summary: "区块间隔异常延迟"
          description: "当前出块间隔 ({{ $value | humanize }}秒) 超过平均出块时间的3倍"
          处理建议: |
            1. 检查验证者节点响应时间
            2. 查看网络延迟情况
            3. 分析是否有节点性能问题
            4. 评估是否需要替换验证者

      # 网络分叉告警
      - alert: 网络分叉
        expr: |
          # 检测到链分叉（biya_chain_fork == 1 表示分叉）
          biya_chain_fork == 1
        for: 1m
        labels:
          severity: critical
          category: reliability
          subsystem: consensus
        annotations:
          summary: "检测到网络分叉"
          description: "Explorer 和 Tendermint 节点的区块哈希不一致，可能存在严重共识问题"
          处理建议: |
            1. 立即通知技术团队
            2. 分析分叉原因
            3. 检查验证者投票情况
            4. 对比多个节点的区块哈希确认分叉范围
            5. 考虑暂停服务并协调修复

  # ==========================================
  # 2. 节点相关告警
  # ==========================================
  - name: node_related_alerts
    interval: 1m
    rules:
      # 验证者节点离线告警
      - alert: 验证者节点离线
        expr: |
          biya_validator_offline == 1
        for: 3m
        labels:
          severity: critical
          category: availability
          subsystem: validator
        annotations:
          summary: "验证者节点离线 - {{ $labels.node_ip }}"
          description: "验证者节点 {{ $labels.node_ip }} 超过3分钟无响应，无法连接到节点的 /status 接口"
          处理建议: |
            1. 立即检查该验证者节点状态
            2. 查看节点服务器是否正常运行
            3. 检查网络连接
            4. 查看节点日志排查问题
            5. 验证节点 RPC 服务 (http://{{ $labels.node_ip }}:26757/status) 是否可访问

      # 验证者节点 Metrics 端点掉线告警
      - alert: 验证者节点Metrics端点掉线
        expr: |
          up{job="validator-node-metrics"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
          subsystem: validator
        annotations:
          summary: "验证者节点 Metrics 端点掉线 - {{ $labels.instance }}"
          description: |
            验证者节点 {{ $labels.instance }} 的 26760/metrics 端点超过2分钟无响应，Prometheus 无法采集该节点的指标数据。
            
            当前状态：
            - 节点地址: {{ $labels.instance }}
            - Job: {{ $labels.job }}
            - 持续时间: 超过2分钟
          处理建议: |
            1. 立即检查该验证者节点状态
            2. 验证节点 26760 端口是否正常监听: curl http://{{ $labels.instance }}/metrics
            3. 检查节点服务器是否正常运行
            4. 查看节点进程是否异常退出
            5. 检查网络连接和防火墙规则
            6. 查看节点日志排查问题
            7. 验证节点服务是否正常启动
            8. 如果节点服务异常，立即重启节点服务

      # 大规模节点离线告警
      - alert: 大规模节点离线
        expr: |
          (
            count(biya_validator_offline == 1)
            /
            count(biya_validator_offline)
          ) > 0.3
        for: 1m
        labels:
          severity: critical
          category: availability
          subsystem: validator
        annotations:
          summary: "大规模节点离线"
          description: "超过30%的验证者节点同时离线（离线比例: {{ $value | humanizePercentage }}），网络稳定性受到威胁"
          处理建议: |
            1. 立即启动应急预案
            2. 联系所有离线节点运营者
            3. 评估是否暂停服务
            4. 检查是否有网络攻击
            5. 查看离线节点列表：在 Prometheus 中查询 `biya_validator_offline == 1` 获取所有离线节点的 node_ip

      # 大规模验证者节点 Metrics 端点掉线告警
      - alert: 大规模验证者节点Metrics端点掉线
        expr: |
          (
            count(up{job="validator-node-metrics"} == 0)
            /
            count(up{job="validator-node-metrics"})
          ) > 0.3
        for: 1m
        labels:
          severity: critical
          category: availability
          subsystem: validator
        annotations:
          summary: "大规模验证者节点 Metrics 端点掉线"
          description: |
            超过30%的验证者节点 Metrics 端点（26760/metrics）同时掉线（掉线比例: {{ $value | humanizePercentage }}），无法采集指标数据，监控系统受到影响。
            
            当前状态：
            - 掉线节点数量: {{ count(up{job="validator-node-metrics"} == 0) }}
            - 总节点数量: {{ count(up{job="validator-node-metrics"}) }}
            - 掉线比例: {{ $value | humanizePercentage }}
          处理建议: |
            1. 立即启动应急预案
            2. 联系所有掉线节点运营者
            3. 检查是否有网络分区或攻击
            4. 验证 Prometheus 服务器网络连接
            5. 查看离线节点列表：在 Prometheus 中查询 `up{job="validator-node-metrics"} == 0` 获取所有掉线节点
            6. 检查防火墙规则是否变更
            7. 评估是否需要暂停服务进行维护

      # 节点同步落后告警
      - alert: 节点同步落后
        expr: |
          (biya_validator_behind_blocks or (biya_block_height - biya_node_sync_height)) > 100
        for: 10m
        labels:
          severity: warning
          category: performance
          subsystem: sync
        annotations:
          summary: "节点同步落后 - {{ $labels.node }}"
          description: "节点 {{ $labels.node }} 落后最新区块超过100个区块"
          处理建议: |
            1. 检查节点同步状态
            2. 查看节点性能是否正常
            3. 检查网络连接质量
            4. 评估是否需要重启节点

      # 节点同步异常慢告警
      - alert: 节点同步异常慢
        expr: |
          (
            rate(biya_node_sync_height[10m])
            <
            (rate(biya_block_height[10m]) * 0.5)
          )
          and
          (rate(biya_block_height[10m]) > 0)
        for: 10m
        labels:
          severity: warning
          category: performance
          subsystem: sync
        annotations:
          summary: "节点同步异常慢 - {{ $labels.node }}"
          description: "节点 {{ $labels.node }} 同步速度低于正常速度50%"
          处理建议: |
            1. 检查节点硬件资源使用情况
            2. 查看磁盘I/O性能
            3. 分析数据库性能
            4. 考虑优化节点配置或升级硬件

  # ==========================================
  # 3. 性能相关告警
  # ==========================================
  - name: performance_alerts
    interval: 30s
    rules:
      # TPS异常下降告警
      - alert: TPS异常下降
        expr: |
          (
            biya_tps_current 
            < 
           biya_tps_24h_avg * 0.5
          )
          and
          (
            biya_tps_24h_avg > 0
          )
        for: 5m
        labels:
          severity: warning
          category: performance
          subsystem: transaction
        annotations:
          summary: "TPS异常下降"
          description: "当前TPS ({{ $value | humanize }}) 低于历史24小时平均值的50%，已持续超过5分钟"
          处理建议: |
            1. 检查节点运行状态
            2. 查看是否有网络分区
            3. 分析交易来源是否异常
            4. 必要时通知技术团队

      # 交易成功率低告警
      - alert: 交易成功率低
        expr: |
          biya_tx_success_rate < 90
        for: 5m
        labels:
          severity: critical
          category: reliability
          subsystem: transaction
        annotations:
          summary: "交易成功率低"
          description: "交易成功率 ({{ $value }}%) 低于90%，已持续超过5分钟"
          处理建议: |
            1. 立即查看失败交易原因
            2. 检查是否有合约攻击
            3. 分析失败交易的共同特征
            4. 紧急处理高危问题

  # ==========================================
  # 4. Gas费用告警
  # ==========================================
  - name: gas_fee_alerts
    interval: 30s
    rules:
      # Gas价格飙升告警
      - alert: Gas价格飙升
        expr: |
          (
            biya_gas_price 
            > 
            (avg_over_time(biya_gas_price[24h]) * 2)
          )
          and
          (avg_over_time(biya_gas_price[24h]) > 0)
        for: 1m
        labels:
          severity: warning
          category: capacity
          subsystem: gas
        annotations:
          summary: "Gas价格飙升"
          description: "当前Gas价格 ({{ $value | humanize }} Gwei) 超过24小时平均值的2倍"
          处理建议: |
            1. 检查交易池拥堵情况
            2. 分析高Gas消耗的交易类型
            3. 评估是否需要提高Gas限制
            4. 通知用户Gas价格异常

      # 交易池拥堵告警
      - alert: 交易池拥堵
        expr: |
          (
            (biya_mempool_size or biya_chain_mempool_pending_txs or vector(0))
            /
            (biya_mempool_capacity or vector(5000))
          ) > 0.8
          or
          biya_congestion_ratio > 0.8
        for: 1m
        labels:
          severity: warning
          category: performance
          subsystem: mempool
        annotations:
          summary: "交易池拥堵"
          description: "交易池使用率超过80%，可能导致交易延迟"
          处理建议: |
            1. 分析交易池中的交易类型
            2. 检查是否有垃圾交易攻击
            3. 评估提高Gas费用阈值
            4. 考虑扩展节点处理能力

      # 交易池满载告警
      - alert: 交易池满载
        expr: |
          (
            (biya_mempool_size or biya_chain_mempool_pending_txs or vector(0))
            /
            (biya_mempool_capacity or vector(5000))
          ) > 0.95
          or
          biya_congestion_ratio > 0.95
        for: 1m
        labels:
          severity: critical
          category: capacity
          subsystem: mempool
        annotations:
          summary: "交易池满载"
          description: "交易池使用率超过95%，新交易可能无法进入交易池"
          处理建议: |
            1. 立即检查是否有恶意攻击
            2. 考虑提高Gas费用阈值
            3. 评估是否需要紧急扩容
            4. 通知用户交易可能被延迟

  # ==========================================
  # 5. 存储告警（验证者节点）
  # ==========================================
  - name: storage_alerts
    interval: 1h
    rules:
      # 验证者节点存储空间不足告警
      - alert: 验证者节点存储空间不足
        expr: |
          (
            1 - (
              node_filesystem_avail_bytes{job="validator-node-exporter", mountpoint="/"}
              /
              node_filesystem_size_bytes{job="validator-node-exporter", mountpoint="/"}
            )
          ) > 0.90
        for: 1h
        labels:
          severity: critical
          category: capacity
          subsystem: storage
        annotations:
          summary: "验证者节点存储空间不足 - {{ $labels.instance }}"
          description: |
            验证者节点 {{ $labels.instance }} 的可用存储空间低于10%，可能导致节点无法正常运行。
            
            当前状态：
            - 节点: {{ $labels.instance }}
            - 挂载点: {{ $labels.mountpoint }}
            - 文件系统: {{ $labels.fstype }}
            - 使用率: {{ $value | humanizePercentage }}
          处理建议: |
            1. 立即清理不必要的日志文件
            2. 考虑启用数据归档
            3. 评估是否需要扩容存储
            4. 检查是否有异常数据增长
            5. 如果空间继续减少，准备暂停节点服务

      # 验证者节点存储空间预警告警
      - alert: 验证者节点存储空间预警
        expr: |
          (
            1 - (
              node_filesystem_avail_bytes{job="validator-node-exporter", mountpoint="/"}
              /
              node_filesystem_size_bytes{job="validator-node-exporter", mountpoint="/"}
            )
          ) > 0.80
        for: 1h
        labels:
          severity: warning
          category: capacity
          subsystem: storage
        annotations:
          summary: "验证者节点存储空间预警 - {{ $labels.instance }}"
          description: |
            验证者节点 {{ $labels.instance }} 的可用存储空间低于20%，建议及时处理。
            
            当前状态：
            - 节点: {{ $labels.instance }}
            - 挂载点: {{ $labels.mountpoint }}
            - 文件系统: {{ $labels.fstype }}
            - 使用率: {{ $value | humanizePercentage }}
          处理建议: |
            1. 检查存储使用情况
            2. 规划存储扩容方案
            3. 清理临时文件和日志
            4. 考虑启用数据压缩或归档
            5. 监控磁盘增长趋势

      # 验证者节点存储增长过快告警
      - alert: 验证者节点存储增长过快
        expr: |
          # 计算24小时存储增长量（GB）
          (
            (
              node_filesystem_size_bytes{job="validator-node-exporter", mountpoint="/"}
              -
              node_filesystem_avail_bytes{job="validator-node-exporter", mountpoint="/"}
            )
            -
            (
              node_filesystem_size_bytes{job="validator-node-exporter", mountpoint="/"} offset 24h
              -
              node_filesystem_avail_bytes{job="validator-node-exporter", mountpoint="/"} offset 24h
            )
          ) / 1024 / 1024 / 1024 > 100
        for: 24h
        labels:
          severity: warning
          category: capacity
          subsystem: storage
        annotations:
          summary: "验证者节点存储增长过快 - {{ $labels.instance }}"
          description: |
            验证者节点 {{ $labels.instance }} 的存储空间在24小时内增长超过100GB，可能存在异常。
            
            当前状态：
            - 节点: {{ $labels.instance }}
            - 挂载点: {{ $labels.mountpoint }}
            - 文件系统: {{ $labels.fstype }}
            - 24小时增长: {{ $value | humanize }} GB
          处理建议: |
            1. 分析存储增长来源
            2. 检查是否有异常数据写入
            3. 评估数据归档策略
            4. 规划长期存储扩容方案
            5. 检查日志文件是否异常增长

  # ==========================================
  # 辅助规则：计算历史平均值和复合指标
  # ==========================================
  - name: recording_rules
    interval: 1m
    rules:
      # 记录7天TPS平均值，用于告警规则
      # 优先使用 biya_tps_24h_avg，如果不存在则使用 biya_tps_current 计算7天平均值
      - record: biya_tps_7d_avg
        expr: |
          (
            avg_over_time(biya_tps_24h_avg[7d])
            or
            avg_over_time(biya_tps_current[7d])
          )

      # 记录TPS下降百分比（相对于7天平均值）
      # 添加除零保护，避免分母为0时产生无效值
      - record: biya_tps_drop_percentage
        expr: |
          (
            (
              (biya_tps_7d_avg - biya_tps_current) 
              / 
              (biya_tps_7d_avg + 0.0001)
            ) * 100
          )

      # 记录当前性能健康度评分 (0-100)
      # 权重：TPS 30%，确认时间 30%，成功率 40%
      # 统一使用 biya_tx_confirm_time_avg_seconds（根据 metrics.go 定义）
      - record: biya_performance_health_score
        expr: |
          (
            # TPS 评分 (0-30分)：当前TPS相对于7天平均值的比例
            clamp_min(
              (biya_tps_current / (biya_tps_7d_avg + 0.0001)) * 30,
              0
            )
            +
            # 确认时间评分 (0-30分)：60秒内为满分，超过60秒线性递减
            clamp_max(
              clamp_min(
                (1 - ((biya_tx_confirm_time_avg_seconds or vector(0)) / 60)) * 30,
                30
              ),
              0
            )
            +
            # 成功率评分 (0-40分)：直接按比例计算
            clamp_min(
              clamp_max(
                (biya_tx_success_rate or vector(0)) * 40,
                0
              ),
              40
            )
          )

      # 记录交易池使用率
      # 优先使用 biya_congestion_ratio，如果不存在则计算
      - record: biya_mempool_usage_ratio
        expr: |
          (
            biya_congestion_ratio
            or
            (
              (biya_mempool_size or biya_chain_mempool_pending_txs or vector(0))
              /
              (biya_mempool_capacity or vector(5000))
            )
          )

      # 记录Gas价格倍数（相对于24h平均）
      # 添加小偏移量避免除零，并处理指标不存在的情况
      - record: biya_gas_price_multiplier
        expr: |
          (
            biya_gas_price or vector(0)
          )
          /
          (
            (avg_over_time(biya_gas_price[24h]) or vector(0)) + 0.0001
          )

  # ==========================================
  # 额外的综合告警（可选）
  # ==========================================
  - name: comprehensive_alerts
    interval: 30s
    rules:
      # 性能综合异常告警
      # 当TPS、延迟、成功率三个指标同时异常时触发
      - alert: 性能综合异常告警
        expr: |
          (
            # TPS 下降超过50%
            (
              biya_tps_current 
              < 
              (biya_tps_7d_avg * 0.5)
            )
            and
            (
              biya_tps_7d_avg > 0
            )
          )
          and
          (
            # 确认时间超过30秒
            (
              (biya_tx_confirm_time_avg_seconds or vector(0)) > 30
            )
          )
          and
          (
            # 成功率低于90%
            (
              (biya_tx_success_rate or vector(0)) < 0.90
            )
          )
        for: 3m
        labels:
          severity: emergency
          category: incident
          subsystem: comprehensive
        annotations:
          summary: "性能综合异常 - 多个指标同时异常"
          description: |
            检测到多个性能指标同时异常，持续超过3分钟：
            - TPS下降超过50%（当前值低于7天平均值的50%）
            - 交易确认时间超过30秒
            - 交易成功率低于90%
            
            请查看 Grafana 仪表板获取详细指标值。
          处理建议: |
            1. 立即启动应急预案
            2. 召集技术团队会商
            3. 全面排查网络问题
            4. 检查节点状态和网络连接
            5. 查看性能健康度评分和详细指标
            6. 必要时暂停服务维护
          runbook_url: "https://docs.biya.chain/runbooks/emergency-response"
          dashboard: "https://grafana.biya.chain/d/chain-performance"
          page_team: "oncall"

      # TPS完全停止告警
      # 当TPS为0且持续超过2分钟时触发（可能是链停止出块）
      - alert: TPS完全停止
        expr: |
          (
            biya_tps_current == 0
          )
          and
          (
            # 确保不是指标缺失（如果区块高度还在增长，说明链还在运行）
            (
              (biya_block_height or biya_chain_head_block_height) > 0
            )
          )
        for: 2m
        labels:
          severity: critical
          category: availability
          subsystem: transaction
        annotations:
          summary: "TPS为零 - 链可能已停止出块"
          description: |
            当前TPS为0，持续超过2分钟。
            
            可能原因：
            1. 链已停止出块
            2. 所有验证者节点离线
            3. 网络分区导致无法达成共识
            4. 严重的共识故障
            
            请立即检查区块高度是否还在增长，以及验证者节点状态。
          处理建议: |
            1. 立即检查所有验证者节点状态（查看 biya_validator_offline 指标）
            2. 检查区块高度是否还在增长（查看 biya_block_height 指标）
            3. 查看是否所有验证者都离线
            4. 检查网络连接和分区情况
            5. 查看节点日志排查共识问题
            6. 启动紧急恢复流程
          runbook_url: "https://docs.biya.chain/runbooks/tps-zero"
          dashboard: "https://grafana.biya.chain/d/chain-performance"
