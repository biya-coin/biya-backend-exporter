server:
  http_listen_port: 9081
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://10.8.190.46:3100/loki/api/v1/push

scrape_configs:
  - job_name: validator-node
    static_configs:
      - targets:
          - localhost
        labels:
          job: validator-node
          node_id: validator-0
          __path__: /data/biyachain/log/biyachaind.log
    
    pipeline_stages:
      - replace:
          expression: "(\x1b\\[|\\^\\[\\[?)[0-9;]*m"
          replace: ''

      - regex:
          expression: '(?P<timestamp>\d{1,2}:\d{2}(?:AM|PM)|\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})\s+(?P<level>INF|ERR|WRN|DBG|FATAL|PANIC)'
          source: log
      - labels:
          level:

      # 仅当匹配到 ERR/FATAL/PANIC 时打 has_error 标签（值为 ERR/FATAL/PANIC，查错可用 has_error=~"ERR|FATAL|PANIC"）
      - regex:
          expression: '(?P<has_error>ERR|FATAL|PANIC)\b'
      - labels:
          has_error:

      # 提取 module 信息（module=xxx）
      - match:
          selector: '{job="validator-node"}'
          stages:
            - regex:
                expression: 'module=(?P<module>\w+)'
            - labels:
                module: